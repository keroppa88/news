name: Daily News Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run.yml'
      - 'web/add_navigation.js'
      - 'newspaper/**'
      - 'newspaper.html'
      - 'paper-newspaper.html'
      - 'web-newspaper.html'
      - 'newspaper.css'
      - 'app.js'
      - 'config.json'
      - 'assets/**'
  schedule:
    - cron: '30 22 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news-update
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest main before generation
        run: git pull --ff-only origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run news scrapers
        if: github.event_name != 'push'
        run: node Run.js

      - name: Run Yahoo Realtime scraper
        if: github.event_name != 'push'
        run: node yahoo_realtime.js
        continue-on-error: true

      - name: Debug - list generated CSV files
        if: github.event_name != 'push'
        run: |
          echo "=== Generated CSV files ==="
          ls -la *.csv 2>/dev/null || echo "No CSV files found"
          echo "=== Log files ==="
          cat logs/*.log 2>/dev/null || echo "No log files"

      - name: Merge CSVs into news.csv
        if: github.event_name != 'push'
        run: node z_get.js

      - name: Pre-filter news.csv (remove noise)
        if: github.event_name != 'push'
        run: node summarize0.js

      - name: Run Gemini Analysis (Step 1 - Extract headlines)
        if: github.event_name != 'push'
        run: node summarize1.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Gemini Analysis (Step 2 - Classify and summarize)
        if: github.event_name != 'push'
        run: node summarize15.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Gemini Analysis (Step 3 - Classify and summarize)
        if: github.event_name != 'push'
        run: node summarize2.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Gemini Analysis (Step 4 - Extract keywords for wordcloud)
        if: github.event_name != 'push'
        run: node summarize3.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Gemini Analysis (Step 5 - Fix formatting and supplement)
        if: github.event_name != 'push'
        run: node summarize4.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Setup Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: github.event_name != 'push'
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Word Cloud
        if: github.event_name != 'push'
        run: python3 generate_wordcloud.py

      - name: Generate Web Page
        if: github.event_name != 'push'
        run: node web/format.js

      - name: Add newspaper navigation
        run: node web/add_navigation.js

      - name: Test newspaper validation
        run: node --test newspaper/newspaper.test.mjs

      - name: Generate newspaper edition
        run: node newspaper/generate-newspaper.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWSPAPER_MODEL: ${{ vars.NEWSPAPER_MODEL || 'gemini-2.5-flash-lite' }}

      - name: Generate one daily editorial visual
        run: node newspaper/generate-daily-visual.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_VISUAL_SELECTION_MODEL: ${{ vars.NEWSPAPER_MODEL || 'gemini-2.5-flash-lite' }}
          DAILY_VISUAL_MODEL: ${{ vars.DAILY_VISUAL_MODEL || 'gemini-2.5-flash-image' }}

      - name: Save results
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add *.csv summary1.txt summary2.txt summary3.txt index.html wordcloud.jpg warehouse/
          if [ -f newspaper.json ]; then git add newspaper.json; fi
          if [ -f daily-visual.json ]; then git add daily-visual.json; fi
          if [ -f daily-visual.png ]; then git add daily-visual.png; fi
          if [ -f daily-visual.jpg ]; then git add daily-visual.jpg; fi
          git commit -m "Automated update: news, summary and web page" || exit 0
          git pull --rebase origin main
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html web-newspaper.html paper-newspaper.html newspaper.html print.html newspaper.css app.js config.json _site/
          cp wordcloud.jpg _site/ 2>/dev/null || true
          cp daily-visual.json daily-visual.png daily-visual.jpg _site/ 2>/dev/null || true
          cp -R assets _site/
          if [ -f newspaper.json ]; then cp newspaper.json _site/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
