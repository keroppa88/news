name: Daily News Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run.yml'
      - 'web/add_navigation.js'
      - 'web/add_market_strip.js'
      - 'market/**'
      - 'newspaper/**'
      - 'paper-newspaper.html'
      - 'config.json'
      - 'assets/**'
      - 'news-quality.js'
      - 'news-quality.test.js'
      - 'summarize2.js'
      - 'summarize4.js'
      - 'summarize15.js'
  schedule:
    - cron: '30 22 * * *'
  # Cloudflare Worker（worker/）が毎日 JST 7:30 に送る合図
  repository_dispatch:
    types: [scheduled-news]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news-update
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    # Cloudflare稼働確認後にリポジトリ変数をtrueにするとGitHubのcronだけ停止。
    if: github.event_name != 'schedule' || vars.CLOUDFLARE_SCHEDULE != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest main before generation
        run: git pull --ff-only origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test news quality guards
        run: node --test news-quality.test.js

      - name: Test Rakuten market quote parser
        run: node --test market/rakuten.test.js

      - name: Run news scrapers
        if: github.event_name != 'push'
        run: node Run.js

      - name: Collect Rakuten market snapshot
        run: node market/collect.js
        continue-on-error: true

      - name: Run Yahoo Realtime scraper
        if: github.event_name != 'push'
        run: node yahoo_realtime.js
        continue-on-error: true

      - name: Collect Yahoo comment ranking
        if: github.event_name != 'push'
        run: node yahoo_comment_ranking.js
        continue-on-error: true

      - name: Debug - list generated CSV files
        if: github.event_name != 'push'
        run: |
          echo "=== Generated CSV files ==="
          ls -la *.csv 2>/dev/null || echo "No CSV files found"
          echo "=== Log files ==="
          cat logs/*.log 2>/dev/null || echo "No log files"

      - name: Merge CSVs into news.csv
        if: github.event_name != 'push'
        run: node z_get.js

      - name: Pre-filter news.csv (remove noise)
        if: github.event_name != 'push'
        run: node summarize0.js

      - name: Run Gemini Analysis (Step 1 - Extract headlines)
        if: github.event_name != 'push'
        run: node summarize1.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Gemini Analysis (Step 2 - Classify and summarize)
        if: github.event_name != 'push'
        run: node summarize15.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Gemini Analysis (Step 3 - Classify and summarize)
        if: github.event_name != 'push'
        run: node summarize2.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Gemini Analysis (Step 4 - Extract keywords for wordcloud)
        if: github.event_name != 'push'
        run: node summarize3.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Gemini Analysis (Step 5 - Fix formatting and supplement)
        if: github.event_name != 'push'
        run: node summarize4.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Repair incomplete published news on code updates
        if: github.event_name == 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if ! node news-quality.js; then
            node summarize15.js
            node summarize2.js
            node summarize4.js
            node web/format.js
          fi

      - name: Setup Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: github.event_name != 'push'
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Word Cloud
        if: github.event_name != 'push'
        run: python3 generate_wordcloud.py

      - name: Generate Web Page
        if: github.event_name != 'push'
        run: node web/format.js

      - name: Add newspaper navigation
        run: node web/add_navigation.js

      - name: Add Rakuten market rows
        run: node web/add_market_strip.js --normal-only

      # Persist paper quotes too: branch-based Pages builds publish this file from main.
      - name: Add paper market rows
        run: node web/add_market_strip.js --paper-only
        continue-on-error: true

      # Commit the normal news update before starting the optional newspaper edition.
      - name: Save news and normal web page
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add *.csv summary1.txt summary2.txt summary3.txt index.html paper-newspaper.html wordcloud.jpg warehouse/ market.json ycomment.json
          git commit -m "Automated update: news, summary and web page" || exit 0
          git pull --rebase origin main
          git push

      - name: Verify paper cartoon layout
        run: |
          if [ -f editorial-cartoon.png ]; then node newspaper/paper-layout.test.mjs; fi
        continue-on-error: true

      - name: Test optional newspaper generation
        id: newspaper_test
        run: node --test newspaper/newspaper.test.mjs
        continue-on-error: true

      - name: Generate optional newspaper edition
        id: newspaper_generation
        if: steps.newspaper_test.outcome == 'success'
        run: node newspaper/generate-newspaper.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWSPAPER_MODEL: ${{ vars.NEWSPAPER_MODEL || 'gemini-2.5-flash-lite' }}

      - name: Save newspaper edition
        if: steps.newspaper_generation.outcome == 'success'
        continue-on-error: true
        run: |
          git add newspaper.json
          git commit -m "Automated update: newspaper edition" || exit 0
          git pull --rebase origin main
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html paper-newspaper.html print.html config.json market.json _site/
          cp wordcloud.jpg _site/ 2>/dev/null || true
          cp -R assets _site/
          if [ -f newspaper.json ]; then cp newspaper.json _site/; fi
          if [ -f ycomment.json ]; then cp ycomment.json _site/; fi
          for file in editorial-cartoon.png editorial-cartoon.json; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
          MARKET_STRIP_ROOT=_site node web/add_market_strip.js --paper-only || echo 'Optional newspaper market rows unavailable'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

