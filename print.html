<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印刷用表示 | News Summary</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#e8e8e8;color:#161616;font-family:Georgia,'Times New Roman',serif}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;max-width:210mm;margin:20px auto 12px;font:14px sans-serif}.toolbar a,.toolbar button{padding:10px 16px;border:1px solid #222;border-radius:3px;background:#fff;color:#111;text-decoration:none;cursor:pointer}.paper{width:210mm;min-height:297mm;margin:0 auto 30px;padding:16mm 14mm;background:white;box-shadow:0 4px 24px #0002}.eyebrow{display:flex;justify-content:space-between;border-top:2px solid #111;border-bottom:1px solid #111;padding:5px 0;font:10px Arial,sans-serif;letter-spacing:.08em}.masthead{text-align:center;font-size:clamp(32px,6vw,56px);font-weight:900;letter-spacing:-.06em;line-height:1.35;margin:12px 0}.subhead{text-align:center;font:11px Arial,sans-serif;letter-spacing:.15em;border-bottom:4px double #111;padding-bottom:12px}.columns{margin-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-height:190mm}.column{min-width:0;border-right:1px solid #bbb;padding:0 10px}.column:first-child{padding-left:0}.column:last-child{padding-right:0;border-right:0}@media(max-width:850px){.toolbar{margin:12px;flex-wrap:wrap}.paper{width:100%;min-height:0;padding:22px 16px}.columns{min-height:65vh}.masthead{font-size:clamp(30px,8vw,56px)}}@page{size:A4;margin:0}@media print{body{background:white}.toolbar{display:none}.paper{width:210mm;min-height:297mm;margin:0;padding:16mm 14mm;box-shadow:none;break-after:page}.columns{min-height:190mm}}
</style>
</head>
<body>
<nav class="toolbar" aria-label="ページ操作"><a href="./">← トップに戻る</a><button type="button" onclick="window.print()">PDFに保存・印刷</button></nav>
<main class="paper" aria-label="印刷用の空の新聞紙面"><div class="eyebrow"><span>NEWS SUMMARY</span><span>PRINT EDITION</span></div><header class="masthead">The Daily News</header><div class="subhead">PRINT EDITION</div><div class="columns" aria-label="記事未掲載の3段組み"><section class="column" aria-label="左段"></section><section class="column" aria-label="中央段"></section><section class="column" aria-label="右段"></section></div></main>
</body>
</html>
