<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>紙新聞風 | Keroppa Morning News</title>
  <style>
    @font-face{font-family:Masthead;src:url('assets/UnifrakturCook-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
    :root{color-scheme:light;--ink:#151515;--paper:#fff;--serif:'Yu Mincho','Hiragino Mincho ProN',serif}
    *{box-sizing:border-box}html{writing-mode:horizontal-tb}body{margin:0;background:#deddd9;color:var(--ink);font-family:var(--serif)}a{color:inherit}.toolbar{width:min(210mm,calc(100% - 20px));margin:8px auto;display:flex;gap:6px;justify-content:space-between;font:11px sans-serif}.toolbar div{display:flex;gap:6px}.toolbar a,.toolbar button{border:1px solid #555;background:#fff;padding:5px 9px;border-radius:2px;text-decoration:none;color:#111;cursor:pointer}.paper{width:min(210mm,100%);min-height:297mm;margin:0 auto 20px;padding:9mm 10mm 10mm;background:var(--paper);box-shadow:0 4px 28px #0002}.topline{display:flex;justify-content:space-between;border-top:3px solid;border-bottom:1px solid;padding:1.5mm 0;font:7pt sans-serif}.masthead{text-align:center;font:700 clamp(35px,7vw,56px)/1.05 Masthead,Georgia,serif;margin:3mm 0 1.5mm}.subhead{text-align:center;border-bottom:4px double;padding-bottom:2mm;font:7pt sans-serif;letter-spacing:.18em}.front-label,.section h2{border-bottom:1px solid;margin:3mm 0 0;padding-bottom:1mm;font:700 10pt/1.3 var(--serif)}.tier{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid #777}.story{min-width:0;border-right:1px solid #bbb;padding:2.5mm 3mm 2.5mm 0;margin-right:3mm}.story:last-child{border-right:0;margin-right:0;padding-right:0}.story .meta{font:6pt sans-serif;color:#555;margin-bottom:.7mm}.story h3{font:700 9.5pt/1.45 var(--serif);margin:0 0 1mm}.story h3 a{text-decoration:none}.story p{font:7.2pt/1.55 var(--serif);margin:0 0 1mm;text-align:justify}.story small{font:6pt/1.35 sans-serif;color:#555}.tier-top{grid-template-columns:1fr}.tier-top .story{display:grid;grid-template-columns:1.35fr 1fr;column-gap:6mm;border-right:0;margin:0;padding:3mm 0}.tier-top .story .meta{grid-column:1/-1}.tier-top .story h3{font-size:18pt;line-height:1.5}.tier-top .story p{font-size:8pt;border-left:1px solid #aaa;padding-left:5mm}.tier-top .story small{grid-column:1}.supplement{break-before:page;margin-top:7mm;padding-top:5mm;border-top:3px solid}.section{margin-top:4mm}.section .articles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid #777}.loading{text-align:center;padding:30mm 0;font:12pt sans-serif}.foot{border-top:1px solid;margin-top:4mm;padding-top:2mm;font:6pt/1.4 sans-serif}.error{color:#8b251b}
    /* One A4 sheet: narrow margins and newspaper-scale type. */
    .paper{width:210mm;height:297mm;min-height:0;padding:5mm 6mm;margin:0 auto 12px;overflow:hidden}.topline{padding:.7mm 0;font-size:5pt}.masthead{font-size:25px;margin:1.2mm 0 .6mm}.subhead{padding-bottom:1mm;font-size:5pt}.front-label,.section h2{margin:1mm 0 0;padding-bottom:.5mm;font-size:6.5pt}.story{padding:1.1mm 1.7mm 1.1mm 0;margin-right:1.7mm}.story .meta{font-size:4.5pt;margin-bottom:.35mm}.story h3{font-size:6.2pt;line-height:1.24;margin:0 0 .45mm}.story p{font-size:5pt;line-height:1.28;margin:0 0 .4mm}.story small{font-size:4.3pt;line-height:1.2}.tier-top .story{column-gap:3mm;padding:1.4mm 0}.tier-top .story h3{font-size:11pt;line-height:1.3}.tier-top .story p{font-size:5.3pt;line-height:1.35;padding-left:3mm}.supplement{break-before:auto;margin-top:1.5mm;padding-top:1.2mm;border-top:2px solid}.section{margin-top:1mm}.foot{margin-top:1.2mm;padding-top:.7mm;font-size:4.3pt;line-height:1.2}
    @media(max-width:700px){.paper{width:100%;height:auto;min-height:0;padding:18px 15px;overflow:visible}.tier,.section .articles{grid-template-columns:1fr}.story{border-right:0;margin-right:0;padding:8px 0}.tier-top .story{display:block}.tier-top .story p{border-left:0;padding-left:0}.masthead{font-size:clamp(31px,10vw,46px)}.story h3,.tier-top .story h3{font-size:16px}.story p,.tier-top .story p{font-size:13px}.toolbar{flex-wrap:wrap}}
    @page{size:A4 portrait;margin:0}@media print{html,body{width:210mm;height:297mm;background:#fff}.toolbar{display:none}.paper{width:210mm;height:297mm;margin:0;padding:5mm 6mm;box-shadow:none;overflow:hidden}.story{page-break-inside:avoid}.foot{break-before:avoid}}
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="紙面操作"><div><a href="./">通常表示</a><a href="newspaper.html">新聞風</a></div><button type="button" onclick="window.print()">印刷 / PDF保存</button></nav>
  <main class="paper"><div class="topline"><span>KEROPPA DAILY BRIEFING</span><span id="date">読み込み中</span></div><header class="masthead">Keroppa Morning News</header><div class="subhead">紙新聞風 ／ PRINT EDITION</div><div id="content" class="loading">紙面を編集中です…</div><footer class="foot">複数媒体の見出しを話題ごとにAIで集約した短い記事です。見出しを押すとGoogleニュース検索を別タブで開きます。</footer></main>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const search=t=>`https://news.google.com/search?q=${encodeURIComponent(t)}&hl=ja&gl=JP&ceid=JP%3Aja`;
    const story=(a,i)=>`<article class="story"><div class="meta">${String(i+1).padStart(2,'0')} ／ ${esc(a.category)}</div><h3><a href="${search(a.title)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h3><p>${esc(a.summary)}</p><small>${esc([...new Set(a.sources.map(s=>s.media))].join(' ・ '))}</small></article>`;
    (async()=>{try{const cfg=await fetch('config.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject());const data=await fetch(cfg.feedUrl,{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject());document.querySelector('#date').textContent=`${data.date} 号`;const important=data.important,tiers=[important.slice(0,1),important.slice(1,4),important.slice(4,7),important.slice(7,10)];document.querySelector('#content').className='';document.querySelector('#content').innerHTML=`<div class="front-label">重要ニュース ｜ 10件</div><section class="front-page" aria-label="重要ニュース4段組み">${tiers.map((items,row)=>`<div class="tier ${row===0?'tier-top':''}" data-tier="${row+1}">${items.map((a,i)=>story(a,row===0?i:1+(row-1)*3+i)).join('')}</div>`).join('')}</section><section class="supplement" aria-label="スポーツとその他"><div class="section"><h2>スポーツ ｜ ${data.sports.length}件</h2><div class="articles">${data.sports.map(story).join('')}</div></div><div class="section"><h2>その他のニュース ｜ ${data.other.length}件</h2><div class="articles">${data.other.map(story).join('')}</div></div></section>`}catch(e){const el=document.querySelector('#content');el.className='loading error';el.textContent='紙面を読み込めませんでした。時間をおいて再読込してください。'}})();
  </script>
</body>
</html>
