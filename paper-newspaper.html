<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>紙新聞風 | Keroppa Morning News</title>
  <style>
    @font-face{font-family:Masthead;src:url('assets/UnifrakturCook-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
    :root{color-scheme:light;--ink:#151515;--paper:#fff;--serif:'Yu Mincho','Hiragino Mincho ProN',serif}
    *{box-sizing:border-box}html{writing-mode:horizontal-tb}body{margin:0;background:#deddd9;color:var(--ink);font-family:var(--serif)}a{color:inherit}.toolbar{width:min(210mm,calc(100% - 20px));margin:8px auto;display:flex;gap:6px;justify-content:space-between;font:11px sans-serif}.toolbar div{display:flex;gap:6px}.toolbar a,.toolbar button{border:1px solid #555;background:#fff;padding:5px 9px;border-radius:2px;text-decoration:none;color:#111;cursor:pointer}.toolbar a[aria-current=page]{background:#222;color:#fff;border-color:#222}.paper{width:210mm;height:297mm;margin:0 auto 12px;padding:5mm 6mm;background:var(--paper);box-shadow:0 4px 28px #0002;overflow:hidden}.topline{display:flex;justify-content:space-between;border-top:3px solid;border-bottom:1px solid;padding:.7mm 0;font:5pt sans-serif}.masthead{text-align:center;font:700 25px/1.05 Masthead,Georgia,serif;margin:1.2mm 0 .6mm}.subhead{text-align:center;border-bottom:4px double;padding-bottom:1mm;font:5pt sans-serif;letter-spacing:.18em}.front-label,.section h2{border-bottom:1px solid;margin:.7mm 0 0;padding-bottom:.35mm;font:700 6.5pt/1.2 var(--serif)}
    .tier{display:grid;border-bottom:1px solid #777;overflow:hidden}.tier[data-tier="1"]{height:30mm}.tier[data-tier="2"]{height:24mm}.tier[data-tier="3"]{height:27mm}.tier[data-tier="4"]{height:23mm}.tier[data-count="1"]{grid-template-columns:1fr}.tier[data-count="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}.tier[data-count="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
    .story{min-width:0;height:100%;overflow:hidden;border-right:1px solid #bbb;padding:.8mm 1.5mm .8mm 0;margin-right:1.5mm;display:flex;flex-direction:column}.story:last-child{border-right:0;margin-right:0;padding-right:0}.story .meta{font:4.3pt/1.15 sans-serif;color:#555;margin-bottom:.25mm;flex:0 0 auto}.story h3{font:700 5.9pt/1.18 var(--serif);margin:0 0 .3mm;flex:0 0 auto}.story h3 a{text-decoration:none}.story p{font:4.8pt/1.22 var(--serif);margin:0 0 .25mm;text-align:justify;flex:1 1 auto}.story small{font:4.1pt/1.15 sans-serif;color:#555;flex:0 0 auto}.tier-top .story{border-right:0;margin:0;padding:1mm 0}.tier-top .story h3{font-size:11pt;line-height:1.15;white-space:nowrap;overflow:hidden;margin-bottom:1mm}.tier-top .story p{font-size:5.2pt;line-height:1.25}
    .feature-reserve{height:31mm;display:grid;grid-template-columns:1.65fr 1fr;border-bottom:1px solid #777}.reserve-slot{position:relative;overflow:hidden;padding:1.2mm 1.5mm}.reserve-slot+ .reserve-slot{border-left:1px solid #aaa}.reserve-label{font:700 4.5pt/1 sans-serif;letter-spacing:.08em;color:#777}.visual-slot:after{content:'風刺画・写真スペース';position:absolute;inset:0;display:grid;place-items:center;font:5pt sans-serif;color:#bbb}.data-slot{display:grid;grid-template-rows:auto 1fr}.data-placeholders{display:grid;grid-template-columns:1fr 1fr;gap:1.5mm;align-items:center;color:#aaa;font:5pt/1.35 sans-serif}.headline-strip{height:9mm;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid #777;overflow:hidden}.headline-only{min-width:0;display:flex;gap:1mm;padding:1mm 1.5mm;border-right:1px solid #bbb;text-decoration:none;font:700 5pt/1.2 var(--serif);overflow:hidden}.headline-only:last-child{border-right:0}.headline-only b{flex:0 0 auto;font:4.3pt sans-serif;color:#666}.supplement{margin-top:1mm;padding-top:.8mm;border-top:2px solid}.section{margin-top:.6mm}.section .articles{height:28mm;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid #777;overflow:hidden}.loading{text-align:center;padding:30mm 0;font:12pt sans-serif}.foot{border-top:1px solid;margin-top:1mm;padding-top:.6mm;font:4.2pt/1.15 sans-serif}.error{color:#8b251b}
    @media(max-width:700px){.paper{width:100%;height:auto;padding:18px 15px;overflow:visible}.tier,.section .articles{height:auto;grid-template-columns:1fr}.feature-reserve{height:auto;min-height:220px;grid-template-columns:1fr}.reserve-slot+ .reserve-slot{border-left:0;border-top:1px solid #aaa}.visual-slot{min-height:150px}.data-slot{min-height:70px}.story{height:auto;min-height:0;border-right:0;border-bottom:1px solid #bbb;margin:0;padding:8px 0}.tier-top .story h3{font-size:16px!important;white-space:normal}.masthead{font-size:clamp(31px,10vw,46px)}.story h3{font-size:16px}.story p,.tier-top .story p{font-size:13px!important}.toolbar{flex-wrap:wrap}}
    @page{size:A4 portrait;margin:0}@media print{html,body{width:210mm;height:297mm;background:#fff}.toolbar{display:none}.paper{width:210mm;height:297mm;margin:0;padding:5mm 6mm;box-shadow:none;overflow:hidden}.story{page-break-inside:avoid}.foot{break-before:avoid}}
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="紙面操作"><div class="mode-switch"><a href="./">通常モード</a><a href="web-newspaper.html">Web新聞風</a><a href="paper-newspaper.html" aria-current="page">紙新聞風</a></div><button type="button" onclick="window.print()">印刷 / PDF保存</button></nav>
  <main class="paper"><div class="topline"><span>KEROPPA DAILY BRIEFING</span><span id="date">読み込み中</span></div><header class="masthead">Keroppa Morning News</header><div class="subhead">紙新聞風 ／ PRINT EDITION</div><div id="content" class="loading">紙面を編集中です…</div><footer class="foot">複数媒体の見出しを話題ごとにAIで集約した短い記事です。見出しを押すとGoogleニュース検索を別タブで開きます。</footer></main>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const search=t=>`https://news.google.com/search?q=${encodeURIComponent(t)}&hl=ja&gl=JP&ceid=JP%3Aja`;
    const story=(a,i)=>`<article class="story"><div class="meta">${String(i+1).padStart(2,'0')} ／ ${esc(a.category)}</div><h3><a href="${search(a.title)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h3><p>${esc(a.summary)}</p><small>${esc([...new Set(a.sources.map(s=>s.media))].join(' ・ '))}</small></article>`;
    const fitPaper=()=>{if(matchMedia('(max-width:700px)').matches)return;const top=document.querySelector('.tier-top h3');if(top){let size=11;top.style.fontSize=`${size}pt`;while(top.scrollWidth>top.clientWidth&&size>6.5){size-=.25;top.style.fontSize=`${size}pt`}}document.querySelectorAll('.story').forEach(article=>{const p=article.querySelector('p');if(!p)return;const max=article.closest('.tier-top')?7:5.8;let size=4.3;p.style.fontSize=`${size}pt`;while(size<max&&article.scrollHeight<=article.clientHeight){size+=.1;p.style.fontSize=`${size}pt`}if(article.scrollHeight>article.clientHeight){size-=.1;p.style.fontSize=`${Math.max(4.2,size)}pt`}})};
    (async()=>{try{const cfg=await fetch('config.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject());const data=await fetch(cfg.feedUrl,{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject());document.querySelector('#date').textContent=`${data.date} 号`;const important=data.important,tiers=[important.slice(0,1),important.slice(1,3),important.slice(3,6),important.slice(6,8)],offsets=[0,1,3,6],headlines=important.slice(8,10);document.querySelector('#content').className='';document.querySelector('#content').innerHTML=`<div class="front-label">重要ニュース ｜ 10件</div><section class="front-page" aria-label="重要ニュース本文4段と予約枠"><div class="tier tier-top" data-tier="1" data-count="1">${story(tiers[0][0],0)}</div><div class="feature-reserve" aria-label="風刺画・写真と市況・天気の予約枠"><div id="lead-visual-slot" class="reserve-slot visual-slot"><span class="reserve-label">VISUAL</span></div><div id="market-weather-slot" class="reserve-slot data-slot"><span class="reserve-label">MARKET / WEATHER</span><div class="data-placeholders"><span>主要株価</span><span>天気</span></div></div></div>${tiers.slice(1).map((items,row)=>`<div class="tier" data-tier="${row+2}" data-count="${items.length}">${items.map((a,i)=>story(a,offsets[row+1]+i)).join('')}</div>`).join('')}<div class="headline-strip" aria-label="重要ニュース見出しのみ">${headlines.map((a,i)=>`<a class="headline-only" href="${search(a.title)}" target="_blank" rel="noopener noreferrer"><b>${String(i+9).padStart(2,'0')}</b><span>${esc(a.title)}</span></a>`).join('')}</div></section><section class="supplement" aria-label="スポーツとその他"><div class="section"><h2>スポーツ ｜ ${data.sports.length}件</h2><div class="articles">${data.sports.map(story).join('')}</div></div><div class="section"><h2>その他のニュース ｜ ${data.other.length}件</h2><div class="articles">${data.other.map(story).join('')}</div></div></section>`;requestAnimationFrame(()=>requestAnimationFrame(fitPaper))}catch(e){const el=document.querySelector('#content');el.className='loading error';el.textContent='紙面を読み込めませんでした。時間をおいて再読込してください。'}})();
  </script>
</body>
</html>
