<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>紙新聞風 | Keroppa Morning News</title>
  <style>
    @font-face{font-family:Masthead;src:url('assets/UnifrakturCook-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
    :root{color-scheme:light;--ink:#151515;--paper:#fff;--serif:'Yu Mincho','Hiragino Mincho ProN',serif}
    *{box-sizing:border-box}html{writing-mode:horizontal-tb}body{margin:0;background:#deddd9;color:var(--ink);font-family:var(--serif)}a{color:inherit}.toolbar{width:min(210mm,calc(100% - 20px));margin:8px auto;display:flex;gap:6px;justify-content:space-between;font:11px sans-serif}.toolbar div{display:flex;gap:6px}.toolbar a,.toolbar button{border:1px solid #555;background:#fff;padding:5px 9px;border-radius:2px;text-decoration:none;color:#111;cursor:pointer}.toolbar a[aria-current=page]{background:#222;color:#fff;border-color:#222}.paper{width:210mm;height:297mm;margin:0 auto 12px;padding:5mm 6mm;background:var(--paper);box-shadow:0 4px 28px #0002;overflow:hidden}.topline{display:flex;justify-content:flex-end;border-top:3px solid;border-bottom:1px solid;padding:.7mm 0;font:5pt sans-serif}.masthead{text-align:center;font:700 50px/1.05 Masthead,Georgia,serif;margin:1.2mm 0 .6mm}.subhead{text-align:center;border-bottom:4px double;padding-bottom:1mm;font:5pt sans-serif;letter-spacing:.18em}.front-label,.section h2{border-bottom:1px solid;margin:.7mm 0 0;padding-bottom:.35mm;font:700 13pt/1.2 var(--serif)}
    .tier{display:grid;border-bottom:1px solid #777;overflow:hidden}.tier[data-tier="1"]{height:26mm}.tier[data-tier="2"]{height:22mm}.tier[data-tier="3"]{height:22mm}.tier[data-tier="4"]{height:22mm}.tier[data-tier="5"]{height:22mm}.tier[data-count="1"]{grid-template-columns:1fr}.tier[data-count="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}.tier[data-count="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
    .story{min-width:0;height:100%;overflow:hidden;border-right:1px solid #bbb;padding:.8mm 1.5mm .8mm 0;margin-right:1.5mm;display:flex;flex-direction:column}.story:last-child{border-right:0;margin-right:0;padding-right:0}.story .meta{font:4.3pt/1.15 sans-serif;color:#555;margin-bottom:.25mm;flex:0 0 auto}.story h3{font:700 11.8pt/1.18 var(--serif);margin:0 0 .3mm;flex:0 0 auto}.story h3 a{text-decoration:none}.story p{font:4.8pt/1.22 var(--serif);margin:0 0 .25mm;text-align:justify;flex:1 1 auto}.story small{font:4.1pt/1.15 sans-serif;color:#555;flex:0 0 auto}.tier-top .story{border-right:0;margin:0;padding:1mm 0}.tier-top .story h3{font-size:22pt;line-height:1.15;white-space:normal;overflow:hidden;margin-bottom:1mm}.tier-top .story p{font-size:5.2pt;line-height:1.25}
    .feature-reserve{height:61.11mm;display:grid;grid-template-columns:99mm 99mm;grid-template-rows:61.11mm;border-bottom:0}.reserve-slot{position:relative;overflow:hidden;padding:1.2mm 1.5mm}.reserve-slot+ .reserve-slot{border-left:1px solid #aaa}.reserve-label{font:700 4.5pt/1 sans-serif;letter-spacing:.08em;color:#777}.visual-slot{width:99mm;height:61.11mm;display:grid;grid-template-rows:61.11mm}.visual-slot+.visual-slot{border-left:0;box-shadow:inset 1px 0 #aaa}.visual-slot:after{content:'風刺画・写真スペース';position:absolute;inset:0;display:grid;place-items:center;font:5pt sans-serif;color:#bbb}.visual-slot.has-image{padding:0;background:#fff}.visual-slot.has-image:after{display:none}.visual-slot img{width:100%;height:61.11mm;min-height:0;display:block;object-fit:contain;object-position:center;filter:grayscale(1)}.visual-caption{position:static;height:5mm;overflow:hidden;padding:.8mm 1.2mm;background:#fff;border-top:1px solid #777;border-bottom:1px solid #777;font:5.2pt/1.25 var(--serif)}.visual-caption b{font:700 4.5pt sans-serif;letter-spacing:.06em;margin-right:1mm}.data-slot{width:99mm;height:61.11mm;border-bottom:1px solid #777;display:grid;grid-template-rows:auto 1fr}.data-placeholders{display:grid;grid-template-columns:1fr 1fr;gap:1.5mm;align-items:center;color:#aaa;font:5pt/1.35 sans-serif}.headline-strip{height:13mm;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid #777;overflow:hidden}.headline-only{min-width:0;display:flex;gap:1mm;padding:1mm 1.5mm;border-right:1px solid #bbb;text-decoration:none;font:700 10pt/1.2 var(--serif);overflow:hidden}.headline-only:last-child{border-right:0}.headline-only b{flex:0 0 auto;font:4.3pt sans-serif;color:#666}.supplement{margin-top:0;padding-top:0;border-top:0}.section{margin-top:.6mm}.section .articles{height:22mm;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid #777;overflow:hidden}.loading{text-align:center;padding:30mm 0;font:12pt sans-serif}.foot{border-top:1px solid;margin-top:1mm;padding-top:.6mm;font:4.2pt/1.15 sans-serif}.error{color:#8b251b}
    @media screen and (max-width:700px){.paper{width:100%;height:auto;padding:18px 15px;overflow:visible}.tier,.section .articles{height:auto;grid-template-columns:1fr}.feature-reserve{width:100%;height:auto;min-height:290px;grid-template-columns:1fr;grid-template-rows:auto auto}.reserve-slot+ .reserve-slot{border-left:0;border-top:1px solid #aaa}.visual-slot{width:100%;height:auto;min-height:0;grid-template-rows:auto}.visual-slot img{height:auto;aspect-ratio:1.62}.data-slot{width:100%;height:auto;min-height:70px}.story{height:auto;min-height:0;border-right:0;border-bottom:1px solid #bbb;margin:0;padding:8px 0}.tier-top .story h3{font-size:32px!important;white-space:normal}.masthead{font-size:clamp(40px,10vw,92px)}.story h3{font-size:32px}.story p,.tier-top .story p{font-size:13px!important}.toolbar{flex-wrap:wrap}}
    @page{size:A4 portrait;margin:0}@media print{html,body{width:210mm;height:297mm;background:#fff}.toolbar{display:none}.paper{width:210mm;height:297mm;margin:0;padding:5mm 6mm;box-shadow:none;overflow:hidden}.story{page-break-inside:avoid}.foot{break-before:avoid}}
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="紙面操作"><div class="mode-switch"><a href="./">通常モード</a><a href="web-newspaper.html">Web新聞風</a><a href="paper-newspaper.html" aria-current="page">紙新聞風</a></div><button type="button" onclick="window.print()">印刷 / PDF保存</button></nav>
  <main class="paper"><div class="topline"><span id="date">読み込み中</span></div><header class="masthead">Keroppa Morning News</header><div class="subhead">紙新聞風 ／ PRINT EDITION</div><div id="content" class="loading">紙面を編集中です…</div></main>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const search=t=>`https://news.google.com/search?q=${encodeURIComponent(t)}&hl=ja&gl=JP&ceid=JP%3Aja`;
    const story=(a,i)=>`<article class="story"><h3><a href="${search(a.title)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h3><p data-one-line="${esc(a.printBody?.oneLine||a.summary)}" data-two-lines="${esc(a.printBody?.twoLines||a.summary)}">${esc(a.summary)}</p></article>`;
    const fitPaper=()=>{
      if(matchMedia('screen and (max-width:700px)').matches)return;
      document.querySelectorAll('.story').forEach(article=>{
        const p=article.querySelector('p'),h=article.querySelector('h3');
        const lines=Math.round(h.getBoundingClientRect().height/parseFloat(getComputedStyle(h).lineHeight));
        article.dataset.headlineLines=lines;
        p.textContent=lines<=1?p.dataset.oneLine:p.dataset.twoLines;
        let size=article.closest('.tier-top')?7:5.8;
        p.style.fontSize=size+'pt';
        while(article.scrollHeight>article.clientHeight&&size>4.2){size=Math.max(4.2,size-.1);p.style.fontSize=size+'pt'}
      });
    };
    document.fonts.ready.then(fitPaper);
    addEventListener('beforeprint',fitPaper);
    (async()=>{try{const cfg=await fetch('config.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject());const data=await fetch(cfg.feedUrl,{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject());document.querySelector('#date').textContent=`${data.date} 号`;const important=data.important,tiers=[important.slice(0,1),important.slice(1,3),important.slice(3,6),important.slice(6,8),important.slice(8,11)],offsets=[0,1,3,6,8],headlines=important.slice(11,13);document.querySelector('#content').className='';document.querySelector('#content').innerHTML=`<section class="front-page" aria-label="重要ニュース本文5段と画像"><div class="tier tier-top" data-tier="1" data-count="1">${story(tiers[0][0],0)}</div><div class="feature-reserve" aria-label="風刺画・写真とワードクラウド"><div id="lead-visual-slot" class="reserve-slot visual-slot"><span class="reserve-label">VISUAL</span></div><div id="wordcloud-slot" class="reserve-slot visual-slot has-image"><img src="wordcloud.jpg" alt="本日のニュースのワードクラウド"></div></div>${tiers.slice(1).map((items,row)=>`<div class="tier" data-tier="${row+2}" data-count="${items.length}">${items.map((a,i)=>story(a,offsets[row+1]+i)).join('')}</div>`).join('')}<div class="headline-strip" aria-label="重要ニュース見出しのみ">${headlines.map((a,i)=>`<a class="headline-only" href="${search(a.title)}" target="_blank" rel="noopener noreferrer"><span>${esc(a.title)}</span></a>`).join('')}</div></section><section class="supplement" aria-label="スポーツとその他"><div class="section"><h2>スポーツ ｜ ${data.sports.length}件</h2><div class="articles">${data.sports.map(story).join('')}</div></div><div class="section"><h2>その他のニュース ｜ ${data.other.length}件</h2><div class="articles">${data.other.map(story).join('')}</div></div></section>`;try{const visual=await fetch(`daily-visual.json?v=${encodeURIComponent(data.date)}`,{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject());if(visual.date===data.date&&visual.image){const slot=document.querySelector('#lead-visual-slot');const kind=visual.mode==='fictional-photo'?'':'<b>風刺画</b>';slot.classList.add('has-image');slot.innerHTML=`<img src="${esc(visual.image)}?v=${encodeURIComponent(visual.generatedAt||data.date)}" alt="${esc(visual.caption||visual.storyTitle||'本日のニュース画像')}">`}}catch{}requestAnimationFrame(()=>requestAnimationFrame(fitPaper))}catch(e){const el=document.querySelector('#content');el.className='loading error';el.textContent='紙面を読み込めませんでした。時間をおいて再読込してください。'}})();
  </script>
</body>
</html>
